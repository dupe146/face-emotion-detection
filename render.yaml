services:
  - type: web
    name: face-emotion-detection
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 0 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7